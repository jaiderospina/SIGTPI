name: SIGTPI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - academic-registry
          - tutoring-service
          - ti-management
          - session-service
          - evaluation-service
          - document-service
          - similarity-service
          - notification-service
          - report-service
          - pki-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigtpi
          POSTGRES_PASSWORD: sigtpi_dev
          POSTGRES_DB: sigtpi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install shared library
        run: pip install -e shared/sigtpi_common

      - name: Install service dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: sigtpi
          POSTGRES_PASSWORD: sigtpi_dev
          POSTGRES_DB: sigtpi_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: sigtpi
          RABBITMQ_PASSWORD: sigtpi_dev
          RABBITMQ_VHOST: sigtpi
          JWT_SECRET_KEY: ci_test_secret_min32chars_padded!!
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: ruff check app/ tests/ || true

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: docker compose build --parallel
