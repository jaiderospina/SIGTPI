[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigtpi-common"
version = "0.1.0"
description = "Shared models, schemas, utilities and messaging for SIGTPI microservices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aio-pika>=9.3",
    "redis[asyncio]>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
    "httpx>=0.26",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "fastapi>=0.109",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sigtpi_common*"]
