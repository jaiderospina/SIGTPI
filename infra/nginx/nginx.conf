events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format json_combined escape=json
        '{"time": "$time_iso8601", "method": "$request_method", '
        '"uri": "$request_uri", "status": $status, '
        '"bytes_sent": $bytes_sent, "duration_ms": $request_time, '
        '"upstream": "$upstream_addr", "x_forwarded_for": "$http_x_forwarded_for"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Upstream definitions
    upstream auth_service        { server auth-service:8001; }
    upstream user_service        { server user-service:8002; }
    upstream academic_registry   { server academic-registry:8003; }
    upstream tutoring_service    { server tutoring-service:8004; }
    upstream ti_management       { server ti-management:8005; }
    upstream session_service     { server session-service:8006; }
    upstream evaluation_service  { server evaluation-service:8007; }
    upstream document_service    { server document-service:8008; }
    upstream similarity_service  { server similarity-service:8009; }
    upstream notification_service{ server notification-service:8010; }
    upstream report_service      { server report-service:8011; }
    upstream pki_service         { server pki-service:8012; }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Auth endpoints (stricter rate limit)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Service routing
        location /api/v1/users/         { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://user_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/academic/      { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://academic_registry; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/tutoring/      { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://tutoring_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/ti/            { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://ti_management; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/sessions/      { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://session_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/evaluations/   { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://evaluation_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/documents/     { limit_req zone=api_limit burst=10 nodelay; proxy_pass http://document_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/similarity/    { limit_req zone=api_limit burst=5  nodelay; proxy_pass http://similarity_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/notifications/ { limit_req zone=api_limit burst=20 nodelay; proxy_pass http://notification_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/reports/       { limit_req zone=api_limit burst=5  nodelay; proxy_pass http://report_service; proxy_set_header X-Real-IP $remote_addr; }
        location /api/v1/pki/           { limit_req zone=api_limit burst=10 nodelay; proxy_pass http://pki_service; proxy_set_header X-Real-IP $remote_addr; }

        # Health aggregation
        location /health {
            return 200 '{"gateway":"healthy","service":"sigtpi-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
