server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/auth/         { proxy_pass http://auth-service:8001/api/v1/auth/;         proxy_set_header Host $host; }
    location /api/users/        { proxy_pass http://user-service:8002/api/v1/;               proxy_set_header Host $host; }
    location /api/academic/     { proxy_pass http://academic-registry:8003/api/v1/;          proxy_set_header Host $host; }
    location /api/tutoring/     { proxy_pass http://tutoring-service:8004/api/v1/;           proxy_set_header Host $host; }
    location /api/ti/           { proxy_pass http://ti-management:8005/api/v1/;              proxy_set_header Host $host; }
    location /api/sessions/     { proxy_pass http://session-service:8006/api/v1/;            proxy_set_header Host $host; }
    location /api/evaluations/  { proxy_pass http://evaluation-service:8007/api/v1/;         proxy_set_header Host $host; }
    location /api/documents/  { proxy_pass http://document-service:8008/api/v1/; proxy_set_header Host $host; }
    location /api/notifications/ { proxy_pass http://notification-service:8010/api/v1/;      proxy_set_header Host $host; }
    location /api/reports/      { proxy_pass http://report-service:8011/api/v1/;             proxy_set_header Host $host; }
}
